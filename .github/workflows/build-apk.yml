name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip BidaAimTrainer-source.zip
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -name 'BidaAimTrainer-source.zip' -not -path './_src/*' | head -n 1)"
          if [ -z "$ZIP" ]; then echo "::error::BidaAimTrainer-source.zip not found in the repository"; exit 1; fi
          echo "Found ZIP: $ZIP"
          rm -rf _src && mkdir _src
          unzip -q "$ZIP" -d _src
          SETTINGS="$(find _src -maxdepth 3 -name settings.gradle | head -n 1)"
          if [ -z "$SETTINGS" ]; then echo "::error::settings.gradle not found inside the ZIP"; exit 1; fi
          PROJECT_DIR="$GITHUB_WORKSPACE/$(dirname "$SETTINGS")"
          echo "Project dir: $PROJECT_DIR"
          ls "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 34 + build-tools 34.0.0
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run engine + trainer tests
        shell: bash
        run: |
          set -o pipefail
          gradle -p "$PROJECT_DIR" :engine:engineTests --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/test.log"

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle -p "$PROJECT_DIR" :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          ls -la "$PROJECT_DIR/app/build/outputs/apk/debug/"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BidaAimTrainer-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            test.log
            build.log
          if-no-files-found: ignore
